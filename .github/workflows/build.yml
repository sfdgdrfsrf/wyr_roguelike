name: Build wyr_roguelike

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify-scenarios:
    runs-on: ubuntu-latest
    stepsname: Build SO File

on:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential cmake

      - name: Build shared library
        run: |
          mkdir build
          cd build
          cmake ..
          make

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: compiled-so-file
          path: build/*.so

      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - name: Generate and verify 400 scenarios
        run: python3 tools/generate_400_scenarios.py --output scenarios.h --verify
      - name: Check generated header is tracked
        run: git diff --exit-code -- scenarios.h

  linux:
    runs-on: ubuntu-latest
    needs: verify-scenarios
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - name: Build Linux x86_64
        run: make linux-x86_64
      - uses: actions/upload-artifact@v4
        with:
          name: wyr_roguelike-linux-x86_64
          path: wyr_roguelike_libretro.so

  windows:
    runs-on: ubuntu-latest
    needs: verify-scenarios
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - name: Install MinGW
        run: sudo apt-get update && sudo apt-get install -y gcc-mingw-w64-x86-64
      - name: Build Windows x86_64
        run: make windows-x86_64
      - uses: actions/upload-artifact@v4
        with:
          name: wyr_roguelike-windows-x86_64
          path: wyr_roguelike_libretro.dll

  android-arm64:
    runs-on: ubuntu-latest
    needs: verify-scenarios
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - name: Install Android NDK
        run: |
          sudo apt-get update
          sudo apt-get install -y unzip wget
          wget -q https://dl.google.com/android/repository/android-ndk-r27c-linux.zip
          unzip -q android-ndk-r27c-linux.zip
          echo "ANDROID_NDK_HOME=$PWD/android-ndk-r27c" >> "$GITHUB_ENV"
      - name: Build Android ARM64
        run: make android-arm64
      - name: Verify ELF architecture
        run: |
          file wyr_roguelike_libretro.so
          readelf -h wyr_roguelike_libretro.so | grep -E 'Class:|Machine:'
      - uses: actions/upload-artifact@v4
        with:
          name: wyr_roguelike-android-arm64
          path: wyr_roguelike_libretro.so
