name: Build wyr_roguelike

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify-scenarios:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Generate and verify 400 scenarios
        run: python3 tools/generate_400_scenarios.py --output scenarios.h --verify

      - name: Check generated header is tracked
        run: git diff --exit-code -- scenarios.h

      - name: Share generated header
        uses: actions/upload-artifact@v4
        with:
          name: scenarios-header
          path: scenarios.h

  linux:
    runs-on: ubuntu-latest
    needs: verify-scenarios
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download generated header
        uses: actions/download-artifact@v4
        with:
          name: scenarios-header

      - name: Install build essentials
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential

      - name: Build Linux x86_64
        run: make linux-x86_64

      - name: Upload Linux binary
        uses: actions/upload-artifact@v4
        with:
          name: wyr_roguelike-linux-x86_64
          path: wyr_roguelike_libretro.so

  windows:
    runs-on: ubuntu-latest
    needs: verify-scenarios
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download generated header
        uses: actions/download-artifact@v4
        with:
          name: scenarios-header

      - name: Install MinGW cross-compiler
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential gcc-mingw-w64-x86-64

      - name: Build Windows x86_64
        run: make windows-x86_64

      - name: Upload Windows binary
        uses: actions/upload-artifact@v4
        with:
          name: wyr_roguelike-windows-x86_64
          path: wyr_roguelike_libretro.dll

  android-arm64:
    runs-on: ubuntu-latest
    needs: verify-scenarios
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download generated header
        uses: actions/download-artifact@v4
        with:
          name: scenarios-header

      - name: Setup Android NDK
        uses: nttld/setup-ndk@v1
        with:
          ndk-version: r27c
          add-to-path: true

      - name: Build Android ARM64
        run: make android-arm64
        env:
          ANDROID_NDK_HOME: ${{ env.ANDROID_NDK_HOME }}

      - name: Verify ELF architecture
        run: |
          file wyr_roguelike_libretro.so
          readelf -h wyr_roguelike_libretro.so | grep -E 'Class:|Machine:'

      - name: Upload Android binary
        uses: actions/upload-artifact@v4
        with:
          name: wyr_roguelike-android-arm64
          path: wyr_roguelike_libretro.so
